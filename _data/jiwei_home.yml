description: Jiwei Sun studies computational thinking, collaborative learning, and science/STEM education in K–12 settings.
intro: >-
  I study how students develop computational thinking through programming,
  collaboration, and science/STEM learning.
about:
  - >-
    I am a PhD researcher in the Faculty of Education at the University of Macau.
    My research focuses on computational thinking (CT), collaborative learning,
    and science/STEM education in K–12 settings.
  - >-
    I examine both learning processes and outcomes, with attention to instructional
    design and students’ interactions during computational problem solving.
    My work combines quantitative and qualitative methods.
research:
  - title: Computational thinking
    text: Teaching and learning through programming, computational problem solving, and the design of learning activities.
  - title: Collaborative learning
    text: Students’ interactions, reasoning, and problem-solving processes as they work together.
  - title: Science/STEM education
    text: Connecting computational approaches with subject learning in K–12 education.
  - title: Educational technology
    text: Understanding how digital tools and instructional design support learning processes and outcomes.
methods:
  - Qualitative content analysis
  - Cluster analysis
  - Lag sequential analysis
  - Epistemic network analysis
  - Structural equation modeling
  - Machine learning
